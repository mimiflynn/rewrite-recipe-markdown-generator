name: PR Build & Test

on:
  pull_request:
    branches:
      - main-upstream
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Compile
        run: ./gradlew compileKotlin compileTestKotlin
      - name: Run tests
        run: ./gradlew test
